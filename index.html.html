button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #8cc7a9;outline-offset:3px}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.05em;margin:0;line-height:1.12;font-weight:600}
em{font-family:'Playfair Display',serif;font-weight:500;color:#37694a;letter-spacing:-.03em}
.dk em,.hero em{color:#c7dfa8}
.ann{background:var(--gr2);color:#d7e7d9;font-size:11px;text-align:center;padding:8px}
header{position:sticky;top:0;z-index:20;background:#faf9f6f5;backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:10px 5%;height:68px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.brand img{width:42px;height:42px;border-radius:50%}
.bw{font:800 15px Manrope;letter-spacing:.12em;line-height:1.1}.bw small{display:block;font-size:8px;letter-spacing:.23em;color:#718077;margin-top:3px}
.dn{display:flex;gap:22px}.dn button,.ta button{border:0;background:none;font-size:12px;font-weight:700;color:#536058;padding:10px 0}
.dn .on{color:#174d3b;border-bottom:2px solid var(--ac)}
.ta{display:flex;gap:10px;align-items:center}.ta .pl{border:1px solid var(--ln);border-radius:99px;padding:8px 12px;background:#fff}
.ta .gs{background:var(--gr);color:#fff;border-radius:8px;padding:10px 14px}
.pop{position:absolute;right:5%;top:62px;width:min(340px,90vw);background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;box-shadow:0 22px 70px #102b1d22;z-index:40}
.po{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:10px;border-radius:10px;text-align:left}.po:hover{background:#f4f6f0}
.po i{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:800 11px Manrope;font-style:normal}
.po b{display:block;font-size:13px}.po small{color:#7b857f;font-size:11px}
.hero{background:var(--gr2);color:#f7f7ed;padding:70px 8% 60px;display:grid;grid-template-columns:1fr 1fr;gap:3%;align-items:center;position:relative;overflow:hidden;isolation:isolate}
.hero:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 78% 42%,#31694d88,transparent 43%),linear-gradient(115deg,#102f25 28%,#12382a 70%,#0e2a22)}
.hero:after{content:'';position:absolute;inset:0;z-index:-1;opacity:.1;background:linear-gradient(#a9d0b21b 1px,transparent 1px),linear-gradient(90deg,#a9d0b21b 1px,transparent 1px);background-size:48px 48px}
.ey{display:flex;align-items:center;gap:9px;color:#b6d4b7;font-size:10px;letter-spacing:.16em;font-weight:700}
.ey b{width:6px;height:6px;border-radius:50%;background:#b8df9a;box-shadow:0 0 0 5px #b8df9a20;animation:pulse 2s infinite}
.hero h1,.chero h1,.pi h1{font-size:clamp(40px,6vw,66px);letter-spacing:-.065em;margin:22px 0 18px}
.hero p,.chero p{color:#d0ddd3;max-width:460px;line-height:1.85}
.pb{border:0;border-radius:8px;background:var(--li);color:#143b2c;padding:14px 18px;font-weight:700;font-size:13px;display:inline-flex;gap:10px;align-items:center;transition:transform .2s,box-shadow .2s;text-decoration:none}
.pb:hover{transform:translateY(-2px);box-shadow:0 8px 24px #c8e3a733}.pb.d{background:var(--gr);color:#fff}.pb:disabled{opacity:.5}
.gb{border:1px solid #ffffff38;border-radius:8px;background:none;color:#f4f4e9;padding:13px 15px;font-weight:600;font-size:13px}
.ob{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;font-size:12px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:26px}
.art{height:420px;position:relative;display:grid;place-items:center}
.or{position:absolute;border:1px solid #a5c7a42e;border-radius:50%;transform:rotate(-24deg)}
.or.a{width:400px;height:260px}.or.b{width:330px;height:380px;transform:rotate(32deg)}.or.c{width:270px;height:270px;border-style:dashed;animation:spin 42s linear infinite}
.core{width:200px;height:200px;border-radius:50%;padding:9px;background:linear-gradient(140deg,#cce3ad,#5b8d6d 40%,#c9a65f 80%);animation:float 5s ease-in-out infinite;z-index:2;box-shadow:0 24px 60px #081c15aa}
.core img{width:100%;height:100%;border-radius:50%;display:block}
.chip{position:absolute;z-index:4;display:flex;gap:10px;align-items:center;background:#f9fbf5;color:#213c2e;border-radius:12px;padding:11px 14px;box-shadow:0 15px 40px #071a1280;animation:float 5s ease-in-out infinite;font-size:12px}
.chip small{display:block;color:#77837a;font-size:10px}.c1{top:40px;right:0}.c2{bottom:50px;left:0;animation-delay:-2s}
.stat{position:absolute;right:10px;bottom:90px;background:#214f3a;border:1px solid #83ad8c55;border-radius:12px;padding:10px 14px;transform:rotate(3deg);font:800 20px Manrope}.stat small{display:block;font:400 9px 'DM Sans';color:#c1d7c5}
.sp{padding:80px 8%}.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:34px;flex-wrap:wrap}
.sh h2{font-size:clamp(30px,4vw,44px)}.sh p{max-width:330px;font-size:13px;color:#778078}
.eyd{color:#66806f}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.cc{border:1px solid #e3e7dd;border-radius:13px;background:#fff;text-align:left;padding:19px;transition:transform .25s,box-shadow .25s}
.cc:hover{transform:translateY(-5px);box-shadow:0 16px 38px #213c2d12}.cc[aria-pressed=true]{outline:2px solid var(--ca)}
.cv{height:110px;display:grid;place-items:center;position:relative;overflow:hidden}
.cv i{position:absolute;width:115px;height:75px;border:1px solid color-mix(in srgb,var(--ca) 50%,transparent);border-radius:50%;transform:rotate(-24deg)}
.cv i+i{width:85px;height:105px;transform:rotate(33deg)}
.cv b{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;background:var(--ct);color:var(--ca);font:800 22px Manrope;transform:rotate(-5deg)}
.cc h3{font-size:24px}.cc p{font-size:11px;color:#758078;margin:2px 0 0}.cc .ft{border-top:1px solid #edf0e9;margin-top:14px;padding-top:11px;font-size:11px;font-weight:700;color:#315943}
.dk{background:var(--gr2);color:#f6f7ef}.dk .eyd{color:#a5c9a9}.dk .sh p{color:#b3c5b8}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fc{border:1px solid #ffffff20;border-radius:13px;background:#183c2f;text-align:left;color:#f6f8f1;padding:18px;transition:transform .2s,border-color .2s}
.fc:hover{transform:translateY(-4px);border-color:#b8d9a777}.fc h3{font-size:19px;margin:12px 0 6px}.fc p{font-size:12px;color:#b3c5b8;margin:0}
.fc .mt{height:8px;border-radius:9px;background:#ffffff1c;overflow:hidden}.fc .mt i{display:block;height:100%;background:linear-gradient(90deg,#d2e8ad,#4b8a61);transition:width .6s}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.ss{display:flex;gap:14px;align-items:center;width:100%;border:1px solid var(--ln);background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;text-align:left}
.ss b{display:block}.ss small{color:var(--mu)}
.nw{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.nc{border:1px solid var(--ln);background:#fff;border-radius:13px;overflow:hidden}.nc .na{height:110px;background:linear-gradient(135deg,var(--ti),var(--gr2));color:var(--ac);display:grid;place-items:center;font:800 26px Manrope}
.nc .nb{padding:16px}.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.1em;color:#92713c;background:#f6ebd4;border-radius:99px;padding:4px 9px}
.dn2{font-size:11px;color:#8a7a52;margin-top:14px}
.cta{background:var(--gr2);color:#f6f7ef;text-align:center;padding:90px 8%;position:relative;overflow:hidden}
.cta:before{content:'';position:absolute;width:500px;height:500px;left:50%;top:35%;transform:translate(-50%,-50%);border:1px solid #d0e4c01a;border-radius:50%;box-shadow:0 0 0 65px #d0e4c00a,0 0 0 130px #d0e4c008}
.cta>*{position:relative}.cta h2{font-size:clamp(34px,5vw,56px);margin:18px 0}.cta p{color:#c2d2c5}
.ft2{padding:30px 8% 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:11px;color:#778179;border-top:1px solid var(--ln)}
.chero{background:linear-gradient(115deg,#102f25,#183d2f);color:#f6f7ee;padding:64px 8%;position:relative;overflow:hidden}
.chero:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 78% 40%,var(--ti),transparent 45%);pointer-events:none}
.chero>*{position:relative;z-index:1}.chero em{color:var(--ac)}
.cgrid{display:grid;grid-template-columns:1fr .8fr;gap:30px;align-items:center}
.wa{height:300px;position:relative;display:grid;place-items:center}
.wa .or{border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.em{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 30%,var(--ti),#0e2a21);border:2px solid var(--ac);color:var(--ac);box-shadow:0 0 70px color-mix(in srgb,var(--ac) 25%,transparent);font:800 24px Manrope;animation:float 6s ease-in-out infinite}
.ag{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.ag button{padding:20px;border:1px solid var(--ln);background:#fff;border-radius:12px;text-align:left;min-height:150px;transition:transform .2s}.ag button:hover{transform:translateY(-3px)}
.ag b{display:block;margin-bottom:6px}.ag span{font-size:12px;color:var(--mu)}
.pi{padding:64px 8% 40px;background:#eff1e9}.pi h1{font-size:clamp(38px,5vw,58px);margin-top:16px}.pi p{max-width:540px;color:var(--mu)}
.w{max-width:860px;margin:0 auto;padding:36px 5% 90px}.w.wide{max-width:1000px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:14px}
.ly{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
label{display:block;font-weight:700;font-size:12px;margin:12px 0 4px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:11px;min-height:44px}
.r4{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.big{font:800 52px Manrope;letter-spacing:-.05em;color:var(--gr)}
.res{background:var(--gr2);color:#f1f5ea;border-radius:14px;padding:22px}.res .big{color:var(--li)}.res p{color:#b3c5b8;font-size:13px}
.mtr{height:8px;border-radius:9px;background:#ffffff22;overflow:hidden;margin:10px 0}.mtr i{display:block;height:100%;background:var(--li);transition:width .5s}
.note{background:#edf2e8;border:1px solid #dfe8d8;border-radius:10px;padding:14px;color:#3e6c47;font-size:12px;margin:14px 0}.note.w2{background:#f6ebd4;border-color:#ecd9a9;color:#7c5f22}
.err{color:#b3261e;font-size:12px}.fine{color:var(--mu);font-size:12px}
.rg{width:130px;height:130px;position:relative;flex:none}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:12;stroke:#e0e6d8}.rg .v{stroke:#3d7a4d;stroke-linecap:round;stroke-dasharray:364.4;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rg div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:800 26px Manrope}.rg small{font:700 9px 'DM Sans';color:var(--mu);letter-spacing:.1em}
.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cat{margin:18px 0 6px;font-weight:700;color:#37694a;font-size:13px}
.it{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--ln);border-radius:11px;background:#fff;margin-bottom:7px;font-weight:400;font-size:14px;margin-top:0;transition:background .2s,transform .2s}
.it:has(input:checked){background:#edf4e8;transform:scale(.995)}.it input{width:22px;min-height:22px;margin-top:2px;flex:none;accent-color:#3d7a4d}
.it>span{flex:1}.tg{font-size:10px;border:1px solid var(--ln);border-radius:6px;padding:1px 7px;margin-left:6px;color:var(--mu)}.tg.o{border-color:var(--gd);color:#8a6a2b}
.x{background:none;border:0;min-width:34px;min-height:34px;font-size:20px;color:var(--mu)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.fl button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700}.fl .on{background:var(--gr);color:#fff}
.bn{display:none}
@keyframes float{50%{transform:translateY(-9px)}}@keyframes spin{to{transform:rotate(336deg)}}@keyframes pulse{50%{box-shadow:0 0 0 9px #b8df9a00}}
@keyframes pop{from{transform:scale(.6);opacity:0}}.cel{animation:pop .5s}
@media(max-width:860px){.hero,.cgrid,.sb,.ly{grid-template-columns:1fr}.art{height:340px}.cg,.nw{grid-template-columns:1fr}.fg,.ag{grid-template-columns:1fr 1fr}.dn,.ta .gs{display:none}
.bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.bn button{border:0;background:none;font-size:10px;font-weight:700;color:#66756a;padding:8px 2px;min-height:44px}.bn .on{color:var(--gr);background:#edf4e8;border-radius:10px}body{padding-bottom:70px}.r4{grid-template-columns:1fr 1fr}.r4 .n{grid-column:1/-1}.chip{transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{header,.bn,.no{display:none}}

return'<section class="pi"><div class="ey eyd">SHALYNX STUDENT SUPPORT</div><h1>Tell us where you are. <em>Let\'s plan what comes next.</em></h1><p>Choose your campus and what you need so your request reaches the right service pathway.</p></section><div class="w">'+note+'<div class="card"><label for="hc">Institution</label><select id="hc" onchange="S.campus=this.value;save();render()">'+CAMPUSES.map(function(c){return'<option value="'+c.id+'"'+(c.id===S.campus?' selected':'')+'>'+c.s+' - '+c.n+'</option>'}).join('')+'</select><label for="hs">I need help with</label><select id="hs">'+CATS.map(function(x){return'<option>'+x+'</option>'}).join('')+'</select><label for="hn">Full name</label><input id="hn" maxlength="80" autocomplete="name"><label for="hp">Phone (optional)</label><input id="hp" maxlength="20" inputmode="tel" autocomplete="tel"><label for="hm">What do you need help with?</label><textarea id="hm" rows="4" maxlength="2000"></textarea><input id="hw" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><label style="font-weight:400"><input type="checkbox" id="hk" style="width:20px;min-height:20px;display:inline;vertical-align:middle"> I agree SHALYNX may use these details to respond to my request.</label><p class="fine">Do not include passwords, ID numbers or payment details.</p><button class="pb d" id="hb" onclick="submitR()">'+(live?'Submit request':'Create my message')+'</button><div id="ho" aria-live="polite"></div></div></div>'+foot()}
function val(){var n=document.getElementById('hn').value.trim(),m=document.getElementById('hm').value.trim(),k=document.getElementById('hk').checked,o=document.getElementById('ho');
if(n.length<2||m.length<10){o.innerHTML='<p class="err">Enter your name and at least 10 characters describing what you need.</p>';return null}
if(!k){o.innerHTML='<p class="err">Please tick the consent box to continue.</p>';return null}
return{n:n,m:m,s:document.getElementById('hs').value,p:document.getElementById('hp').value.trim()}}
function api0(path,opt){opt=opt||{};var h={apikey:CFG.key,'Content-Type':'application/json'};h.Authorization='Bearer '+((SESS&&SESS.token&&!opt.anon)?SESS.token:CFG.key);if(opt.prefer)h.Prefer=opt.prefer;
return fetch(CFG.url+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){j=t}if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||'Request failed ('+r.status+')');return j})})}
function submitR(){var v=val();if(!v)return;var o=document.getElementById('ho'),b=document.getElementById('hb');
if(CFG.php){phpSend(v);return}if(!CFG.url){var t='SHALYNX request\nName: '+v.n+'\nCampus: '+C().n+'\nService: '+v.s+'\nDetails: '+v.m;famsg=t;o.innerHTML='<textarea readonly rows="6" id="ht">'+esc(t)+'</textarea><p><button class="ob" onclick="cp()">Copy message</button> <a class="pb" href="https://wa.me/message/EN7BBRSTAIXYD1" target="_blank" rel="noopener">Open WhatsApp and paste</a></p>';return}
if(!SESS){o.innerHTML='<p class="err">Please sign in first.</p>';return}
b.disabled=true;b.textContent='Submitting...';
api('/rest/v1/service_requests',{method:'POST',prefer:'return=representation',body:{institution_id:S.campus,category:v.s,message:v.m,contact_name:v.n,contact_phone:v.p||null,consent:true}}).then(function(r){var q=Array.isArray(r)?r[0]:r;if(!q||!q.reference)throw new Error('The server did not confirm the request.');conv();o.innerHTML='<div class="note cel"><b>Request saved.</b> Your reference is <b>'+esc(q.reference)+'</b>. Track it under My account.</div>';b.textContent='Submit request';b.disabled=false}).catch(function(e){o.innerHTML='<p class="err">Not saved: '+esc(e.message)+'</p>';b.textContent='Submit request';b.disabled=false})}
function cp(){var t=document.getElementById('ht');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}}
var MY=null,AM='';
function account(){var h='<section class="pi"><div class="ey eyd">MY ACCOUNT</div><h1>Your <em>progress</em>, your requests.</h1></section><div class="w">';
if(!CFG.url)return h+'<div class="note w2"><b>Accounts are not connected yet.</b> Your progress is saved on this device only. Add your Supabase URL and anon key to the CFG block at the top of the page, host the file, and sign-in plus request tracking turn on.</div></div>'+foot();
if(!SESS)return h+'<div class="card"><label for="ae">Email</label><input id="ae" type="email" autocomplete="email"><label for="ap">Password (8+ characters)</label><input id="ap" type="password" autocomplete="current-password"><p><button class="pb d" onclick="auth(0)">Sign in</button> <button class="ob" onclick="auth(1)">Create account</button></p><p id="am" class="err">'+esc(AM)+'</p></div></div>'+foot();
if(MY===null){api('/rest/v1/service_requests?select=reference,category,status,created_at&order=created_at.desc').then(function(r){MY=r;render()}).catch(function(e){MY=[];AM=e.message;render()})}
return h+'<div class="card"><b>'+esc(SESS.email)+'</b> <button class="ob" onclick="SESS=null;MY=null;try{localStorage.removeItem(\'shx_sess\')}catch(e){}render()">Sign out</button></div><h2 style="font-size:22px;margin:18px 0 10px">My service requests</h2>'+(MY===null?'<p class="fine">Loading...</p>':MY.length?MY.map(function(r){return'<div class="card"><b>'+esc(r.reference)+'</b> <span class="tag">'+esc(r.status.replace(/_/g,' '))+'</span><p class="fine" style="margin:6px 0 0">'+esc(r.category)+' &middot; '+new Date(r.created_at).toLocaleDateString()+'</p></div>'}).join(''):'<p class="fine">No requests yet. Submit one from the Support page.</p>')+'</div>'+foot()}
function auth(up){var e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value,m=document.getElementById('am');
if(!/^\S+@\S+\.\S+$/.test(e)||p.length<8){m.textContent='Enter a valid email and a password of at least 8 characters.';return}
m.textContent='Please wait...';
api(up?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:{email:e,password:p}}).then(function(r){if(!r.access_token){m.style.color='#3e6c47';m.textContent='Account created. Check your email to confirm, then sign in.';return}
SESS={token:r.access_token,rt:r.refresh_token,email:e};try{localStorage.setItem('shx_sess',JSON.stringify(SESS))}catch(x){}MY=null;AM='';pull();render()}).catch(function(x){m.textContent=x.message})}
function newsV(){var c=C();
return'<section class="pi"><div class="ey eyd">CAMPUS PULSE / '+c.s+'</div><h1>Stay in the know. <em>Move with confidence.</em></h1><p>Guides and updates organised around the institution you choose.</p></section><div class="w wide"><div class="fl"><button class="'+(news2?'':'on')+'" onclick="news2=false;render()">For '+c.s+'</button><button class="'+(news2?'on':'')+'" onclick="news2=true;render()">All campuses</button><span class="tag" style="align-self:center">SAMPLE CONTENT</span></div>'+
'<div class="card"><b>No verified updates for '+(news2?'any campus':c.s)+' yet.</b><p class="fine" style="margin:6px 0 0">Official notices will appear here only with a named source and a verification date. Until then, read the student guides below.</p></div><div class="nw">'+
[['STUDENT GUIDE','Your semester, organised: the documents worth keeping in one place','4 min read','gt'],['STUDENT GUIDE','A checklist for following official university announcements','3 min read','ck'],['GRADUATE LIFE','Graduating soon? Start organising your post-school documents early','5 min read','gr']].map(function(n){return'<article class="nc"><div class="na">'+c.s.slice(0,2).toUpperCase()+'</div><div class="nb"><span class="tag">'+n[0]+'</span><h3 style="font-size:17px;margin:10px 0 6px">'+n[1]+'</h3><small class="fine">'+n[2]+' &middot; sample, not a campus notice</small></div></article>'}).join('')+'</div>'+
'<div class="note" style="margin-top:20px"><b>Trust comes first.</b> Items above are sample editorial content, not verified current campus news. Each published article will show its source, publication date and verification date.</div></div>'+foot()}
function board(){return'<section class="pi"><div class="ey eyd">SHALYNX COMMUNITY</div><h1>Celebrate progress. <em>Not just popularity.</em></h1><p>Recognition for useful participation and verified achievements, with privacy protected.</p></section><div class="w"><div class="card"><b>The leaderboard is not live yet.</b><p class="fine" style="margin:6px 0 0">It needs accounts, consent and a clear points policy first. When it opens, joining will be optional, and private results like CGPA or fees will never be ranked or shown.</p></div><button class="pb d" onclick="go(\'account\')">Create an account</button></div>'+foot()}
if(location.hash&&['home','campus','tools','cgpa','fresh','nysc','globe','services','news','board','account','privacy'].indexOf(location.hash.slice(1))>=0)cur=location.hash.slice(1);

function att(k){try{return(JSON.parse(localStorage.getItem('shx_att')||'{}'))[k]||''}catch(e){return''}}
(function(){try{var p=new URLSearchParams(location.search),a=JSON.parse(localStorage.getItem('shx_att')||'{}'),ch=0;['gclid','utm_source','utm_medium','utm_campaign','utm_term'].forEach(function(k){if(p.get(k)){a[k]=p.get(k).slice(0,100);ch=1}});if(ch)localStorage.setItem('shx_att',JSON.stringify(a))}catch(e){}})();
function conv(){try{if(window.gtag&&CFG.gads&&CFG.gaConv)gtag('event','conversion',{send_to:CFG.gads+'/'+CFG.gaConv})}catch(e){}}
function loadAds(){if(!CFG.gads||window.gtag)return;var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtag/js?id='+CFG.gads;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',CFG.gads)}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href*="wa.me"]');if(a)conv()});
function phpSend(v){var o=document.getElementById('ho'),b=document.getElementById('hb');b.disabled=true;b.textContent='Submitting...';
fetch(CFG.php,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({campus:S.campus,category:v.s,message:v.m,name:v.n,phone:v.p,consent:true,hp:document.getElementById('hw').value,gclid:att('gclid'),utm:att('utm_campaign')})}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||'Request failed');return j})}).then(function(j){conv();o.innerHTML='<div class="note cel"><b>Request saved.</b> Your reference is <b>'+esc(j.reference)+'</b>. Quote it on WhatsApp if you need a follow-up.</div>'}).catch(function(e){o.innerHTML='<p class="err">Not saved: '+esc(e.message)+'. You can also message us on WhatsApp.</p>'}).then(function(){b.disabled=false;b.textContent='Submit request'})}
function privacy(){return'<section class="pi"><div class="ey eyd">PRIVACY</div><h1>Privacy <em>notice</em></h1></section><div class="w"><div class="card"><h3>What we collect</h3><p>When you submit a request we collect your name, optional phone number, chosen campus, service category and your message. If you create an account we store your email. Checklists and calculator inputs stay in your browser unless you are signed in.</p><h3 style="margin-top:14px">Why</h3><p>To respond to your request and improve the service. We do not sell your data.</p><h3 style="margin-top:14px">Advertising</h3><p>If you accept cookies, Google Ads measures which ads lead to enquiries. We keep campaign parameters such as gclid in your browser to attribute a request. You can decline.</p><h3 style="margin-top:14px">Your choices</h3><p>To correct or delete your data, message us on WhatsApp or visit Shop 47, IMSU Plaza, Owerri.</p><p class="fine">Template notice: have it reviewed against Nigerian data protection law before running paid ads.</p></div></div>'+foot()}
(function(){if(!CFG.gads)return;var c=null;try{c=localStorage.getItem('shx_ck')}catch(e){}if(c==='1')return loadAds();if(c==='0')return;var d=document.createElement('div');d.setAttribute('role','dialog');d.setAttribute('aria-label','Cookie notice');d.style.cssText='position:fixed;left:12px;right:12px;bottom:78px;max-width:520px;margin:auto;background:#102f25;color:#f1f5ea;border-radius:12px;padding:14px;z-index:60;font-size:13px;box-shadow:0 10px 40px #0006';d.innerHTML='We use cookies to measure which ads work. <br><button class="pb" style="padding:8px 12px;margin:6px 6px 0 0">Accept</button><button class="gb" style="padding:7px 12px;margin-top:6px">Decline</button> <a href="#privacy" style="color:#c8e3a7">Privacy</a>';var b=d.querySelectorAll('button');function fin(v){try{localStorage.setItem('shx_ck',v)}catch(e){}d.remove();if(v==='1')loadAds()}b[0].onclick=function(){fin('1')};b[1].onclick=function(){fin('0')};document.body.appendChild(d)})();

function api(p,o){return api0(p,o).catch(function(e){if(SESS&&SESS.rt&&/JWT/i.test(e.message))return api0('/auth/v1/token?grant_type=refresh_token',{method:'POST',anon:1,body:{refresh_token:SESS.rt}}).then(function(r){SESS.token=r.access_token;SESS.rt=r.refresh_token;try{localStorage.setItem('shx_sess',JSON.stringify(SESS))}catch(x){}return api0(p,o)});throw e})}
var pt=null;function sched(){if(!CFG.url||!SESS)return;clearTimeout(pt);pt=setTimeout(push,1500)}
function push(){if(!CFG.url||!SESS)return;var c=S.campus;api('/rest/v1/tool_state?on_conflict=user_id,tool,institution_id',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:[{tool:'cgpa',institution_id:c,data:S.cg},{tool:'fresh',institution_id:c,data:{checks:S.checks.fresh||{},custom:S.custom.fresh||[]}},{tool:'nysc',institution_id:c,data:{checks:S.checks.nysc||{},custom:S.custom.nysc||[]}},{tool:'glob',institution_id:c,data:{checks:S.checks.globe||{},custom:S.custom.globe||[],gp:S.gp}}]}).catch(function(){})}
function pull(){if(!CFG.url||!SESS)return;api('/rest/v1/tool_state?select=tool,data,updated_at&order=updated_at.asc').then(function(rows){if(!rows.length){push();return}rows.forEach(function(r){var d=r.data||{};if(r.tool==='cgpa'&&d.rows)S.cg=d;else if(r.tool==='fresh'||r.tool==='nysc'){S.checks[r.tool]=d.checks||{};S.custom[r.tool]=d.custom||[]}else if(r.tool==='glob'){S.checks.globe=d.checks||{};S.custom.globe=d.custom||[];if(d.gp)S.gp=d.gp}});try{localStorage.setItem('shx2',JSON.stringify(S))}catch(e){}render()}).catch(function(){})}
if(SESS&&CFG.url)pull();
render();
</script></body></html>
