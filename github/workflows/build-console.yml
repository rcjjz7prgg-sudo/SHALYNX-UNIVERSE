# Builds the HQ console from console-src.zip and commits the result to /console.
# Save this file in the repo as:  .github/workflows/build-console.yml
name: build-console

on:
  push:
    branches: [main]
    paths:
      - 'console-src.zip'
      - '.github/workflows/build-console.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-console
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack source
        run: |
          test -f console-src.zip || (echo "console-src.zip is missing from the repo root" && exit 1)
          rm -rf apps/admin && mkdir -p apps/admin
          unzip -q console-src.zip -d apps/admin

      - name: Install dependencies
        working-directory: apps/admin
        run: npm install --no-audit --no-fund

      - name: Type check
        working-directory: apps/admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/admin
        run: npx vite build --outDir ../../console --emptyOutDir

      - name: Commit the build
        run: |
          git config user.name "shalynx-build"
          git config user.email "build@users.noreply.github.com"
          git add console
          if git diff --cached --quiet; then echo "No changes to publish"; else
            git commit -m "Build HQ console"
            git push
          fi

      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
